# Production topology (TDD §12.2). Run from the repository root:
#   docker compose -f infra/docker-compose.yml --env-file /etc/bookstore/.env up -d   (ENV_FILE defaults to the same path)
name: bookstore

x-app: &app
  image: bookstore-app:${APP_VERSION:-latest}
  build: { context: .., target: app }
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  env_file: ${ENV_FILE:-/etc/bookstore/.env}
  environment:
    NODE_ENV: production
    TZ: Asia/Ho_Chi_Minh
    APP_VERSION: ${APP_VERSION:-latest}
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  networks: [private]

x-postgres-env: &pgenv
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  PGBACKREST_REPO1_S3_ENDPOINT: ${S3_ENDPOINT}
  PGBACKREST_REPO1_S3_BUCKET: ${S3_BACKUP_BUCKET}
  PGBACKREST_REPO1_S3_REGION: ${S3_REGION}
  PGBACKREST_REPO1_S3_KEY: ${S3_ACCESS_KEY}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${S3_SECRET_KEY}
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
  # The cluster's superuser is POSTGRES_USER; without this pgBackRest connects as "postgres",
  # which does not exist, and stanza-create and every backup fail.
  PGBACKREST_PG1_USER: ${POSTGRES_USER}

services:
  caddy:
    image: bookstore-caddy:${APP_VERSION:-latest}
    build: { context: .., target: caddy }
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [private]

  migrate:
    <<: *app
    restart: "no"
    working_dir: /app/packages/db
    command: ["node", "--experimental-strip-types", "src/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    working_dir: /app/apps/api
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      APP_VERSION: ${APP_VERSION:-latest}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      APP_ORIGIN: https://${SITE_DOMAIN}
      STORAGE_DIR: /files
    volumes:
      - files:/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    working_dir: /app/apps/worker
    command: ["node", "--import", "tsx", "src/main.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  postgres:
    image: bookstore-postgres:18
    build: { context: ./postgres }
    restart: unless-stopped
    shm_size: 1g
    environment: *pgenv
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
      - pgspool:/var/spool/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]

  backup:
    image: bookstore-postgres:18
    restart: unless-stopped
    user: postgres
    command: ["/usr/local/bin/backup-loop.sh"]
    environment:
      <<: *pgenv
      DUMP_DIR: /dumps
      DUMP_PASSPHRASE: ${BACKUP_CIPHER_PASS}
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql
      - pgspool:/var/spool/pgbackrest
      # Second location for the weekly logical copy (TDD §11.4): mount provider block storage here.
      - ${DUMP_HOST_DIR:-/srv/bookstore-dumps}:/dumps
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]

volumes:
  pgdata:
  pgsocket:
  pgspool:
  files:
  caddy_data:
  caddy_config:

networks:
  private:
