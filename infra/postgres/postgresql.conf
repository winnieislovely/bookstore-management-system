# Production settings (TDD §11.3–11.4). Tune memory after the first month (pg_stat_statements).
listen_addresses = '*'
max_connections = 100
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_level = replica
max_wal_size = 4GB
shared_preload_libraries = 'pg_stat_statements'
timezone = 'UTC'
log_timezone = 'UTC'

# Continuous archiving: at least every 60 seconds (RPO within 15 minutes, NFR-AVL-02).
archive_mode = on
archive_timeout = 60
archive_command = 'pgbackrest --stanza=bookstore archive-push %p'
