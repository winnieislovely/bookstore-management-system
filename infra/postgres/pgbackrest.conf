# pgBackRest (TDD §11.4). S3 endpoint, bucket, keys and the cipher passphrase come from the
# environment: PGBACKREST_REPO1_S3_ENDPOINT, _S3_BUCKET, _S3_KEY, _S3_KEY_SECRET, _S3_REGION,
# PGBACKREST_REPO1_CIPHER_PASS. The passphrase is also kept outside the VPS (password manager).
[global]
repo1-type=s3
repo1-path=/bookstore
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=7
process-max=2
compress-type=zst
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[bookstore]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
