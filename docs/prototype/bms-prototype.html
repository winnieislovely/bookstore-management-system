<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Bookshelf – Bản mô phỏng</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet" />
<style>
:root {
  --navy-900:#16233A; --navy-700:#22344F; --navy-100:#DCE3EC; --navy-50:#EEF2F7;
  --sand-300:#D8C7A6; --sand-100:#F3ECDD; --sky-300:#A9C4D4; --sea-500:#7FA3B8; --olive-600:#5B6B3A; --olive-700:#4A5830;
  --paper-100:#F5F2EA; --paper-200:#EDE9DF; --paper-300:#D9D3C4; --paper-500:#8C8574;
  --ink-900:#1A2638; --ink-700:#3D4A5C; --ink-500:#5C6675; --ink-300:#A3A9B3;
  --ok-50:#E7F1EA; --ok-700:#2E6B45; --warn-50:#FBF1DE; --warn-700:#8A5A12; --bad-50:#F8E9E6; --bad-700:#A63A2B; --info-50:#E6EFF5; --info-700:#2F6385;
  --r-md:8px; --r-lg:12px; --shadow:0 1px 2px rgb(26 38 56 / .06), 0 4px 16px rgb(26 38 56 / .06);
  --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* Times New Roman, not Georgia, as the offline fallback: Georgia lacks Vietnamese stacked marks (ố, ấ). */
  --display:'Cormorant Garamond', 'Times New Roman', Times, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 var(--font); color: var(--ink-900); background: var(--paper-200); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.code { font-weight: 500; letter-spacing: .01em; }

/* ---------- Demo chrome (outside the app) ---------- */
.demo-bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--ink-900); color: #fff; font-size: 13px; flex-wrap: wrap; }
.demo-bar b { color: var(--sand-300); font-weight: 600; }
.demo-bar .sp { flex: 1; }
.demo-bar button { border: 1px solid rgb(255 255 255 / .25); background: transparent; color: #fff; border-radius: 999px; padding: 4px 12px; }
.demo-bar button.on { background: var(--sand-300); color: var(--navy-900); border-color: var(--sand-300); }
.stage { display: flex; justify-content: center; padding: 0; }
body.phone .stage { padding: 24px 16px 48px; }
.app { container-type: inline-size; container-name: app; width: 100%; min-height: calc(100vh - 44px); background: #fff; display: flex; position: relative; overflow: hidden; }
body.phone .app { width: 390px; min-height: 780px; height: 844px; border-radius: 36px; border: 10px solid var(--ink-900); box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
body.phone .app .main { overflow-y: auto; }

/* ---------- Sidebar ---------- */
.side { width: 248px; flex: none; background: var(--navy-700); color: #E9EDF3; display: flex; flex-direction: column; }
.brand { padding: 18px 20px 14px; line-height: 1; }
.brand small { display: block; font-size: 9px; letter-spacing: .3em; font-weight: 600; }
.brand strong { display: block; font-size: 20px; letter-spacing: .18em; font-weight: 700; margin: 3px 0; }
.brand em { display: block; text-align: right; font-style: normal; font-size: 8px; letter-spacing: .3em; padding-right: 2px; font-weight: 600; }
.nav { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.nav h6 { margin: 14px 12px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #9FB0C6; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; text-decoration: none; color: #E9EDF3; font-size: 13.5px; position: relative; }
.nav a:hover { background: rgb(255 255 255 / .07); }
.nav a.act { background: rgb(255 255 255 / .12); color: #fff; font-weight: 600; }
.nav a.act::before { content: ''; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--sand-300); }
.nav a .ico { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav a .badge { margin-left: auto; background: var(--sand-300); color: var(--navy-900); border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }
.side-foot { border-top: 1px solid rgb(255 255 255 / .1); padding: 10px 8px; }
.side-foot a { display: flex; gap: 10px; align-items: center; padding: 7px 12px; color: #C9D3E0; text-decoration: none; font-size: 13px; }

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; }
.top { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--paper-300); position: sticky; top: 0; background: #fff; z-index: 5; }
.top .menu-btn { display: none; border: 0; background: none; padding: 6px; }
.top .sp { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--navy-100); color: var(--navy-700); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.bell { position: relative; border: 0; background: none; padding: 6px; color: var(--ink-700); }
.bell i { position: absolute; top: 0; right: 0; background: var(--bad-700); color: #fff; border-radius: 999px; font-size: 10px; font-style: normal; padding: 0 5px; line-height: 16px; }
.page { padding: 24px; max-width: 1440px; width: 100%; }
.ph { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.ph h1 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 600; color: var(--navy-700); }
.ph .back { border: 0; background: none; color: var(--navy-700); font-size: 20px; padding: 0 4px; }
.ph .sp { flex: 1; }

/* ---------- Components ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--paper-500); background: #fff; color: var(--ink-900); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--navy-50); }
.btn.pri { background: var(--navy-700); border-color: var(--navy-700); color: #fff; }
.btn.pri:hover { background: var(--navy-900); }
.btn.acc { background: var(--olive-600); border-color: var(--olive-600); color: #fff; }
.btn.acc:hover { background: var(--olive-700); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad-700); border-color: var(--bad-700); }
.btn.sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn.lg { height: 44px; padding: 0 20px; font-size: 15px; }
.btn.full { width: 100%; justify-content: center; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.card { background: #fff; border: 1px solid var(--paper-300); border-radius: var(--r-lg); }
.card.pad { padding: 18px; }
.card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.card .sub { color: var(--ink-500); font-size: 13px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--paper-200); color: var(--ink-700); }
.chip.ok { background: var(--ok-50); color: var(--ok-700); }
.chip.warn { background: var(--warn-50); color: var(--warn-700); }
.chip.bad { background: var(--bad-50); color: var(--bad-700); }
.chip.info { background: var(--info-50); color: var(--info-700); }
.chip.sand { background: var(--sand-100); color: #6E5B36; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; border: 1px solid var(--paper-500); border-radius: var(--r-md); padding: 0 12px; background: #fff; min-width: 0; flex: 1; max-width: 420px; }
.search input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; }
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 500; color: var(--ink-700); }
.field input, .field select, .field textarea { height: 38px; border: 1px solid var(--paper-500); border-radius: var(--r-md); padding: 0 10px; background: #fff; outline: 0; }
.field textarea { height: 72px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--navy-700); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tbl-wrap { border: 1px solid var(--paper-300); border-radius: var(--r-lg); overflow-x: auto; background: #fff; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th { background: var(--paper-200); text-align: left; font-size: 13px; font-weight: 600; color: var(--ink-700); padding: 11px 14px; white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--paper-300); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--navy-50); }
th.r, td.r { text-align: right; }
td .muted, .muted { color: var(--ink-500); font-size: 12.5px; }
th:first-child, td:first-child { position: sticky; left: 0; background: inherit; }
td:first-child { background: #fff; }
tr.click:hover td:first-child { background: var(--navy-50); }
th:first-child { background: var(--paper-200); box-shadow: inset -1px 0 0 var(--paper-300); }
td:first-child { box-shadow: inset -1px 0 0 var(--paper-300); }
.kpi { border: 1px solid var(--paper-300); border-radius: var(--r-md); padding: 10px 12px; }
.kpi span { display: block; font-size: 12.5px; color: var(--ink-500); }
.kpi b { font-size: 20px; font-weight: 700; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--paper-300); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; color: var(--ink-700); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--navy-700); border-color: var(--navy-700); font-weight: 600; }
.rows > div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
.rows > div.tot { font-weight: 700; font-size: 16px; border-top: 1px solid var(--paper-300); margin-top: 6px; padding-top: 10px; }
.note { background: var(--info-50); color: var(--info-700); border-radius: var(--r-md); padding: 10px 12px; font-size: 13px; }
.note.warn { background: var(--warn-50); color: var(--warn-700); }
.note.ok { background: var(--ok-50); color: var(--ok-700); }
.bar { height: 8px; border-radius: 99px; background: var(--paper-200); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--navy-700); border-radius: 99px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; }
.empty { text-align: center; color: var(--ink-500); padding: 40px 16px; }

/* ---------- Dialog & toast ---------- */
.scrim { position: absolute; inset: 0; background: rgb(22 35 58 / .45); display: grid; place-items: center; z-index: 30; padding: 16px; }
.dlg { background: #fff; border-radius: 16px; width: min(560px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 20px 50px rgb(0 0 0 / .2); }
.dlg header { display: flex; align-items: center; padding: 16px 20px 6px; }
.dlg header h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; }
.dlg header button { border: 0; background: none; font-size: 20px; color: var(--ink-500); }
.dlg .body { padding: 8px 20px 4px; }
.dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px 18px; }
.toast { position: absolute; right: 16px; bottom: 16px; z-index: 40; background: var(--ok-50); color: var(--ok-700); border: 1px solid #BFD9C7; border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); font-weight: 500; max-width: calc(100% - 32px); }

/* ---------- POS ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100vh - 44px - 52px); }
body.phone .pos { height: auto; }
.pos-left { padding: 16px; overflow: auto; border-right: 1px solid var(--paper-300); }
.pos-top { height: 52px; background: var(--navy-700); color: #fff; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.pos-top .sp { flex: 1; }
.net { font-size: 12px; border-radius: 999px; padding: 2px 10px; background: rgb(255 255 255 / .12); }
.net.off { background: var(--warn-50); color: var(--warn-700); }
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.prod { border: 1px solid var(--paper-300); border-radius: 10px; padding: 10px; text-align: left; background: #fff; display: flex; flex-direction: column; gap: 6px; }
.prod:hover { border-color: var(--navy-700); }
.cover { height: 64px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 22px; }
.prod b { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
.cart { display: flex; flex-direction: column; min-height: 0; background: #fff; }
.cart-lines { flex: 1; overflow: auto; padding: 12px 16px; }
.cline { padding: 10px 0; border-bottom: 1px solid var(--paper-200); }
.cline .nm { font-weight: 600; font-size: 13.5px; }
.qty { display: inline-flex; align-items: center; gap: 6px; }
.qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--paper-500); background: #fff; }
.qty span { min-width: 22px; text-align: center; font-weight: 600; }
.cart-sum { border-top: 1px solid var(--paper-300); padding: 12px 16px 16px; background: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { height: 48px; border-radius: 10px; border: 1px solid var(--paper-300); background: #fff; font-size: 18px; font-weight: 500; }
.keypad button:hover { background: var(--navy-50); }

/* ---------- Overview ---------- */
.hero { background: var(--navy-700); color: #fff; border-radius: 20px; padding: 32px; position: relative; overflow: hidden; }
.hero h1 { font-family: var(--display); font-size: 42px; margin: 0 0 6px; line-height: 1.1; font-weight: 600; }
.hero p { color: #D2DAE5; max-width: 720px; margin: 0; font-size: 15px; }
.hero .stats { display: flex; gap: 28px; margin-top: 22px; flex-wrap: wrap; }
.hero .stats div b { display: block; font-size: 26px; color: var(--sand-300); }
.hero .stats div span { font-size: 12.5px; color: #B8C4D4; }
.mod { cursor: pointer; transition: border-color .15s, transform .15s; }
.mod:hover { border-color: var(--navy-700); transform: translateY(-2px); }
.mod .tag { float: right; }
.timeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.tl { border-radius: 10px; padding: 12px; border: 1px solid var(--paper-300); }
.tl.done { background: var(--ok-50); border-color: #BFD9C7; }
.tl.next { background: var(--sand-100); border-color: var(--sand-300); }
.tl b { display: block; font-size: 16px; }
.tl span { font-size: 12px; color: var(--ink-700); }
h2.sec { font-size: 18px; margin: 28px 0 12px; color: var(--navy-700); font-weight: 600; }

/* ---------- Responsive (container queries so the phone frame works too) ---------- */
@container app (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .timeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pos { grid-template-columns: minmax(0, 1fr) 320px; }
}
@container app (max-width: 767px) {
  .side { position: absolute; z-index: 20; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgb(0 0 0 / .3); }
  .app.drawer .side { transform: none; }
  .top { padding: 0 16px; }
  .top .menu-btn { display: block; }
  .page { padding: 16px; }
  .ph h1 { font-size: 22px; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding: 22px; }
  .hero h1 { font-size: 32px; }
  .pos { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; height: auto; }
  .pos-left { border-right: 0; }
  .prod-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dlg { border-radius: 16px 16px 0 0; align-self: end; width: 100%; }
  .scrim { padding: 0; place-items: end center; }
  .hide-phone { display: none !important; }
  .count-table { display: none; }
  .count-cards { display: flex !important; }
}
.count-cards { display: none; flex-direction: column; gap: 10px; }
.count-card { display: flex; gap: 12px; align-items: center; border: 1px solid var(--paper-300); border-radius: 12px; padding: 14px; }
.count-card input { width: 72px; height: 44px; border: 1px solid var(--paper-500); border-radius: 8px; text-align: right; padding: 0 10px; font-size: 16px; }
.tree-row td:first-child { padding-left: calc(14px + var(--d, 0) * 22px); }
</style>
</head>
<body>
<div class="demo-bar">
  <span>📖 <b>The Bookshelf BMS</b> – bản mô phỏng có thể bấm thử · dữ liệu minh họa, không lưu</span>
  <span class="sp"></span>
  <button data-go="overview">Giới thiệu dự án</button>
  <button data-go="dashboard">Vào ứng dụng</button>
  <button id="phoneBtn">📱 Xem như điện thoại</button>
</div>
<div class="stage"><div class="app" id="app"></div></div>

const app = document.getElementById('app');
function go(route, param = null) { S.route = route; S.param = param; S.q = ''; S.tab = 0; S.dlg = null; app.classList.remove('drawer'); location.hash = param ? `${route}/${param}` : route; render(); app.scrollTop = 0; const m = app.querySelector('.main'); if (m) m.scrollTop = 0; window.scrollTo(0, 0); }
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2600); }
function dialog(d) { S.dlg = d; render(); }
window.addEventListener('hashchange', () => { const [r, p] = location.hash.slice(1).split('/'); if (r && (r !== S.route || (p ?? null) !== S.param)) { S.route = r; S.param = p ?? null; S.dlg = null; render(); } });

const tr = (cells, go2) => `<tr class="${go2 ? 'click' : ''}" ${go2 ? `data-go="${go2}"` : ''}>${cells.map((c) => `<td class="${typeof c === 'number' || /₫$/.test(c) ? 'r num' : ''}">${typeof c === 'number' ? nf(c) : c}</td>`).join('')}</tr>`;
const search = (ph) => `<label class="search">${IC.search}<input data-q placeholder="${ph}" value="${S.q}"></label>`;
const match = (...xs) => !S.q || xs.join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').includes(S.q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'));

function dlgHtml() {

  const make = (title, body, foot) => `<div class="scrim" data-close><div class="dlg" role="dialog" aria-label="${title}"><header><h2>${title}</h2><button data-close aria-label="Đóng">×</button></header><div class="body">${body}</div><footer>${foot}</footer></div></div>`;
  switch (d.k) {
    case 'pay': {
      const given = d.given ?? 0;
      return make('Phương thức thanh toán', `<div class="row" style="justify-content:space-around;margin-bottom:12px">${['Tiền mặt', 'CK', 'Thẻ'].map((m) => `<label class="row" style="gap:6px"><input type="radio" name="pm" ${(d.m ?? 'Tiền mặt') === m ? 'checked' : ''} data-pm="${m}">${m}</label>`).join('')}</div>

        ${(d.m ?? 'Tiền mặt') === 'Tiền mặt' ? `<div class="keypad" style="margin-top:12px">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '000', 0, '⌫'].map((k) => `<button data-key="${k}">${k}</button>`).join('')}</div>` : ''}`,
        `<button class="btn acc full lg" ${(d.m ?? 'Tiền mặt') === 'Tiền mặt' && given && given < total ? 'disabled' : ''} data-act="paid">Xác nhận</button>`);

/* ============================== Render & events ============================== */
function render() {
  const r = SCREENS[S.route] ? S.route : 'dashboard';
  const isPos = r === 'pos', isOverview = r === 'overview';
  const navActive = { sale: 'sales', customer: 'customers', product: 'products', count: 'counts' }[r] ?? r;
  const nav = NAV.map((g) => `${g.label ? `<h6>${g.label}</h6>` : ''}${g.items.map(([k, t, ic, b]) => `<a href="#${k}" data-go="${k}" class="${navActive === k ? 'act' : ''}">${IC[ic]}<span>${t}</span>${b ? `<span class="badge">${b}</span>` : ''}</a>`).join('')}`).join('');
  const side = `<aside class="side"><div class="brand"><small>THE</small><strong>BOOKSHELF</strong><em>HANOI</em></div><nav class="nav">${nav}</nav><div class="side-foot"><a href="#overview" data-go="overview">ⓘ Giới thiệu dự án</a></div></aside>`;
  const top = `<div class="top"><button class="menu-btn" data-act="drawer" aria-label="Mở menu">☰</button><span class="sp"></span><button class="bell" data-act="notif" aria-label="Thông báo">${IC.bell}<i>3</i></button><span class="avatar">CT</span><span class="hide-phone" style="font-weight:500">Nguyễn Chủ Tiệm</span></div>`;
  const html = SCREENS[r].call(SCREENS);
  app.innerHTML = isPos ? html : `${isOverview ? '' : side}<div class="main">${isOverview ? '' : top}${html}</div>`;
  app.insertAdjacentHTML('beforeend', dlgHtml() + (S.toast ? `<div class="toast">✓ ${S.toast}</div>` : ''));
  document.querySelectorAll('.demo-bar [data-go]').forEach((b) => b.classList.toggle('on', (b.dataset.go === 'overview') === isOverview));
  const q = app.querySelector('[data-q]'); if (q && S.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

document.addEventListener('input', (e) => { if (e.target.matches('[data-q]')) { S.q = e.target.value; S.focusQ = true; render(); S.focusQ = false; } });
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-count]')) { (S.counts ??= {})[t.dataset.count] = t.value === '' ? null : +t.value.replace(/\D/g, ''); render(); }
  if (t.matches('[data-pm]')) { S.dlg = { ...S.dlg, m: t.dataset.pm }; render(); }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-act],[data-add],[data-inc],[data-dec],[data-tab],[data-key],[data-close]');
  if (!el) return;
  if (el.matches('[data-close]') && e.target !== el && !e.target.matches('[data-close]')) return;
  e.preventDefault();
  const d = el.dataset;
  if (d.go) { const [r, p] = d.go.split('/'); return go(r, d.param ?? p ?? null); }
  if (d.tab) { S.tab = +d.tab; return render(); }
  if (d.add) { const p = PRODUCTS.find((x) => x.sku === d.add); const l = S.cart.find((x) => x.p === p); l ? l.q++ : S.cart.push({ p, q: 1 }); return render(); }
  if (d.inc) { S.cart[+d.inc].q++; return render(); }
  if (d.dec) { const l = S.cart[+d.dec]; if (--l.q <= 0) S.cart.splice(+d.dec, 1); return render(); }
  if (d.key !== undefined) { let g = String(S.dlg.given ?? ''); g = d.key === '⌫' ? g.slice(0, -1) : g + d.key; S.dlg.given = +g || 0; return render(); }
  if ('close' in d) { S.dlg = null; return render(); }
  const A = {
    drawer: () => { app.classList.toggle('drawer'); },
    notif: () => dialog({ title: 'Thông báo', text: '• 1 bảng kê COD có chênh lệch (LYFG7A)<br>• 1 sách thư viện quá hạn: Số đỏ – Võ Thị Hà<br>• Phiếu đặt trước DT-2026-00002 sắp hết hạn giữ' }),
    net: () => { S.online = !S.online; toast(S.online ? 'Đã có mạng – đồng bộ 1 đơn ngoại tuyến' : 'Mô phỏng mất mạng: vẫn bán được, đơn lưu trên máy'); },
    pay: () => dialog({ k: 'pay' }), paid: () => { const total = S.cart.reduce((a, l) => a + l.p.price * l.q - (l.p.cat === 'Thiếu nhi' ? Math.round(l.p.price * l.q * 0.1) : 0), 0); dialog({ k: 'paid', change: S.dlg.given ? Math.max(0, S.dlg.given - total) : 0 }); },
    newsale: () => { S.cart = []; S.cust = null; S.dlg = null; render(); },
    hold: () => { S.cart = []; toast('Đã giữ giỏ hàng'); },
    cust: () => dialog({ k: 'cust' }), pickcust: () => { S.cust = 'Phạm Thị Dung'; S.dlg = null; render(); },
    scan: () => dialog({ k: 'scan' }), scanned: () => { S.dlg = null; if (S.route === 'pos') { const p = PRODUCTS[2]; const l = S.cart.find((x) => x.p === p); l ? l.q++ : S.cart.push({ p, q: 1 }); render(); } else { (S.counts ??= {})['SACH-0003'] = ((S.counts['SACH-0003']) ?? 0) + 1; toast('Đã đếm SACH-0003 · Dế Mèn phiêu lưu ký'); } },
    newship: () => dialog({ k: 'newship' }), shipped: () => { S.dlg = null; toast('Đã tạo đơn DH-2026-00004 và vận đơn GHN'); },
    reconcile: () => dialog({ k: 'reconcile' }), reconciled: () => { S.dlg = null; toast('Đã đối soát – Đã khớp'); },
    return: () => dialog({ k: 'return' }), returned: () => { S.dlg = null; toast('Đã tạo phiếu trả TH-2026-00002 · hoàn 58.500 ₫'); },
    einvoice: () => dialog({ k: 'einvoice' }), sent: () => { S.dlg = null; toast('Đã gửi lại hóa đơn điện tử'); },
    loan: () => dialog({ k: 'loan' }), loaned: () => { S.dlg = null; toast('Đã cho mượn – phiếu PT-2026-00003'); },
    checkin: () => dialog({ k: 'checkin' }), feepaid: () => { S.dlg = null; toast('Đã thu phí trả trễ 10.000 ₫'); },
    submitcount: () => toast('Đã gửi phiếu kiểm để duyệt'),
    print: () => toast('Đã gửi phiếu 80 mm tới máy in'), labels: () => toast('Đã mở bản in nhãn kệ khổ A4'),
    export: () => toast('Đã xuất tệp Excel (minh họa)'), saved: () => toast('Đã lưu cài đặt'), backup: () => toast('Đã yêu cầu sao lưu – hoàn tất sau khoảng 1 phút'),
    stockin: () => dialog({ title: 'Nhập thêm hàng', text: 'Quét ISBN hoặc mã vạch để thêm sản phẩm, chỉnh số lượng, chọn nhà cung cấp (tùy chọn) rồi xác nhận. Giá vốn bình quân tự tính lại khi đổi giá nhập.' }),
    merge: () => dialog({ title: 'Gộp hồ sơ trùng', text: 'Điểm và lịch sử mua của hồ sơ được chọn sẽ chuyển sang hồ sơ này. Hồ sơ kia đóng lại.' }),
    importcheck: () => dialog({ title: 'Kết quả kiểm tra', text: '18 dòng · 18 sản phẩm mới · Không có lỗi. Lượt nhập ghi tất cả các dòng hoặc không dòng nào, và có thể hoàn tác.' }),
    soon: () => dialog({ title: 'Trong bản mô phỏng', text: 'Màn này có trong ứng dụng thật; bản mô phỏng chỉ minh họa các luồng chính.' }),
  };
  A[d.act]?.();
});
document.getElementById('phoneBtn').onclick = (e) => { document.body.classList.toggle('phone'); e.currentTarget.classList.toggle('on'); e.currentTarget.textContent = document.body.classList.contains('phone') ? '🖥 Xem như máy tính' : '📱 Xem như điện thoại'; render(); };
document.querySelectorAll('.demo-bar [data-go]').forEach((b) => (b.onclick = () => go(b.dataset.go)));
const [r0, p0] = location.hash.slice(1).split('/'); if (r0 && SCREENS[r0]) { S.route = r0; S.param = p0 ?? null; }
render();
</script>
</body>
